<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03070c">
<title>COPOXXX NEXUS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="screen">
  <header class="topline">
    <span><i class="pulse"></i> NEXUS // PLANETARY INTERFACE</span>
    <span class="live"><b></b> SYSTEM ONLINE</span>
  </header>

  <section class="planet-wrap" aria-label="Animated rotating planet">
    <div class="orbit orbit-a"></div>
    <div class="orbit orbit-b"></div>
    <div class="orbit orbit-c"></div>
    <div class="planet">
      <div class="continents"></div>
      <div class="clouds"></div>
      <div class="shadow"></div>
      <div class="planet-label">COPOXXX</div>
    </div>
    <div class="ring-light"></div>
    <span class="orbital-point point-a"></span>
    <span class="orbital-point point-b"></span>
  </section>

  <section class="content">
    <p class="overline">ESTABLISHING SECURE CONNECTION</p>
    <h1>COPOXXX <span>NEXUS</span></h1>
    <p class="sub">A SIGNAL BEYOND THE ORDINARY</p>
    <div class="terminal" aria-live="polite">
      <span class="prompt">root@nexus:~$</span>
      <span id="terminal-text">initializing planetary interface</span><span class="cursor">_</span>
    </div>
    <a class="discord" href="https://dsc.gg/zerocodex" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 5.2A18.3 18.3 0 0 0 15.2 3.8l-.6 1.2a16.8 16.8 0 0 0-5.2 0l-.6-1.2a18.3 18.3 0 0 0-4.5 1.4C1.5 9.4.7 13.5 1.1 17.5a18.5 18.5 0 0 0 5.5 2.8l1.2-1.9-1.9-.9.5-.4c3.7 1.7 7.7 1.7 11.3 0l.5.4-1.9.9 1.2 1.9a18.5 18.5 0 0 0 5.5-2.8c.5-4.7-.8-8.7-3.3-12.3ZM8.7 14.8c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.6 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
      <span>JOIN THE DISCORD</span><b>↗</b>
    </a>
    <p class="invite">dsc.gg/zerocodex</p>
  </section>

  <footer class="bottomline">
    <span>PLANETARY VISUAL SYSTEM <i></i></span>
    <span>ANIMATION: <b>CONTINUOUS</b></span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
